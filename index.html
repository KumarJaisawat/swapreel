<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SwapReel AI</title>

<style>

body{
background:#0f0f0f;
font-family:Arial;
color:white;
text-align:center;
padding:20px;
}

h1{
font-size:40px;
}

.box{
background:#1a1a1a;
padding:20px;
border-radius:20px;
margin-top:20px;
}

input{
margin-top:10px;
}

button{
background:linear-gradient(45deg,#ff0066,#00ccff);
border:none;
padding:15px 30px;
color:white;
font-size:18px;
border-radius:15px;
margin-top:20px;
}

video,img{
width:100%;
max-width:300px;
margin-top:20px;
border-radius:15px;
}

.plan{
background:#1a1a1a;
padding:20px;
border-radius:20px;
margin-top:20px;
}

</style>
</head>

<body>

<h1>SwapReel AI</h1>

<p>High Quality AI Face Swap Tool</p>

<div class="box">

<h2>Upload Face</h2>
<input type="file" id="faceInput">

<img id="facePreview">

<h2>Upload Video</h2>
<input type="file" id="videoInput">

<video id="videoPreview" controls></video>

<br>

<button onclick="generateVideo()">
Generate Video
</button>

<p id="status"></p>

</div>

<div class="plan">
<h2>15 Days Plan</h2>
<h1>₹49</h1>
<button>Buy Now</button>
</div>

<div class="plan">
<h2>30 Days Plan</h2>
<h1>₹99</h1>
<button>Buy Now</button>
</div>

<script>

const faceInput = document.getElementById("faceInput");
const facePreview = document.getElementById("facePreview");

faceInput.onchange = function(){
facePreview.src = URL.createObjectURL(faceInput.files[0]);
}

const videoInput = document.getElementById("videoInput");
const videoPreview = document.getElementById("videoPreview");

videoInput.onchange = function(){
videoPreview.src = URL.createObjectURL(videoInput.files[0]);
}

function generateVideo(){

document.getElementById("status").innerHTML =
"AI Processing Started...";

setTimeout(() => {

document.getElementById("status").innerHTML =
"Face Swap Complete ✅";

},3000)

}

</script>

</body>
</html>
