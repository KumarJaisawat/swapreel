<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SwapReel AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f0f0f;
color:white;
padding:20px;
}

.logo{
text-align:center;
font-size:40px;
font-weight:bold;
margin-top:20px;
background:linear-gradient(45deg,#ff0066,#00ccff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
text-align:center;
color:#aaa;
margin-top:10px;
margin-bottom:30px;
}

.container{
background:#181818;
padding:20px;
border-radius:20px;
max-width:500px;
margin:auto;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.section{
margin-top:20px;
}

label{
display:block;
margin-bottom:10px;
font-size:18px;
}

input[type=file]{
width:100%;
padding:10px;
background:#222;
border:none;
border-radius:10px;
color:white;
}

img,video{
width:100%;
margin-top:15px;
border-radius:15px;
display:none;
}

button{
width:100%;
padding:15px;
margin-top:25px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
background:linear-gradient(45deg,#ff0066,#00ccff);
color:white;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.status{
margin-top:20px;
text-align:center;
font-size:18px;
color:#00ff99;
}

.download-btn{
display:none;
background:#00cc66;
}

.plan-box{
background:#181818;
padding:20px;
border-radius:20px;
margin-top:25px;
max-width:500px;
margin-left:auto;
margin-right:auto;
}

.plan-title{
font-size:24px;
margin-bottom:10px;
}

.price{
font-size:35px;
font-weight:bold;
color:#00ccff;
}

.plan-btn{
margin-top:15px;
background:#ff0066;
}

footer{
text-align:center;
margin-top:40px;
color:#666;
font-size:14px;
}

</style>
</head>

<body>

<div class="logo">SwapReel AI</div>

<div class="subtitle">
High Quality AI Face Swap Video Tool
</div>

<div class="container">

<div class="section">
<label>Upload Face Image</label>

<input type="file" id="faceUpload" accept="image/*">

<img id="facePreview">
</div>

<div class="section">
<label>Upload Video</label>

<input type="file" id="videoUpload" accept="video/*">

<video id="videoPreview" controls></video>
</div>

<button onclick="generateVideo()">
Generate AI Video
</button>

<div class="status" id="status"></div>

<button class="download-btn" id="downloadBtn">
Download Video
</button>

</div>

<div class="plan-box">

<div class="plan-title">
15 Days Plan
</div>

<div class="price">
₹49
</div>

<p>
720P Video Quality
</p>

<button class="plan-btn">
Buy Now
</button>

</div>

<div class="plan-box">

<div class="plan-title">
30 Days Premium
</div>

<div class="price">
₹99
</div>

<p>
Full HD 1080P + Fast Render
</p>

<button class="plan-btn">
Buy Now
</button>

</div>

<footer>
© 2026 SwapReel AI
</footer>

<script>

const faceUpload = document.getElementById("faceUpload");
const facePreview = document.getElementById("facePreview");

faceUpload.addEventListener("change",function(){

const file = this.files[0];

if(file){

facePreview.style.display = "block";

facePreview.src = URL.createObjectURL(file);

}

});

const videoUpload = document.getElementById("videoUpload");
const videoPreview = document.getElementById("videoPreview");

videoUpload.addEventListener("change",function(){

const file = this.files[0];

if(file){

videoPreview.style.display = "block";

videoPreview.src = URL.createObjectURL(file);

}

});

function generateVideo(){

const status = document.getElementById("status");

const downloadBtn =
document.getElementById("downloadBtn");

status.innerHTML =
"AI Processing Started...";

downloadBtn.style.display = "none";

setTimeout(()=>{

status.innerHTML =
"Face Swap Complete ✅";

downloadBtn.style.display = "block";

},4000);

}

</script>
<script src="script.js"></script>
</body>
</html>
